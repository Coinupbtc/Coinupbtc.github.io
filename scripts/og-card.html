<!doctype html>
<!-- Share card for coinupbtc.com. Render with scripts/export-og.sh (1200x630 → assets/og-image.png). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400..600&family=IBM+Plex+Mono:wght@500&display=block" rel="stylesheet">
  <style>
    :root { --paper: #f5f7f6; --ink: #14191a; --mute: #56625f; --rule: #d5dcda; --accent: #0b6b52; --soft: #e2efea; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--paper); color: var(--ink); }
    .card { box-sizing: border-box; width: 1200px; height: 630px; padding: 72px 84px; display: grid; grid-template-rows: auto 1fr auto; gap: 28px; }
    .label { font: 500 20px/1.2 "IBM Plex Mono", monospace; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }
    h1 { margin: 0; font: 600 84px/1.04 "Fraunces", Georgia, serif; letter-spacing: -0.015em; max-width: 17ch; align-self: center; }
    .foot { display: flex; justify-content: space-between; align-items: center; border-top: 2px solid var(--rule); padding-top: 26px; }
    .tag { font: 500 22px/1 "IBM Plex Mono", monospace; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent);
           border: 2px dashed var(--accent); background: var(--soft); border-radius: 6px; padding: 12px 16px; }
    .domain { font: 600 28px/1 "IBM Plex Sans", sans-serif; }
  </style>
</head>
<body>
  <div class="card">
    <p class="label">Quality engineer · ISO 13485 medical devices</p>
    <h1>I find the checks that pass when they shouldn’t.</h1>
    <div class="foot">
      <span class="tag">Case files · evidence linked</span>
      <span class="domain">coinupbtc.com</span>
    </div>
  </div>
</body>
</html>
